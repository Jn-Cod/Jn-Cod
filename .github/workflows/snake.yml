name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: Platane/snk@v3
        with:
          github_user_name: Jn-Cod
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-dark.gif?palette=github-dark&color_snake=#22d3ee&color_dots=#0a0c12,#1f2430,#394b7a,#22d3ee,#f472b6
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
